[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", "manual_migrations", "android-app"]

[tool.ruff.lint]
# Стартовый прагматичный набор: ошибки/пиcостиль (E), pyflakes (F), bugbear (B).
# Расширять (isort "I", pyupgrade "UP") — отдельной задачей вместе с автофиксом.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "B008", # Depends(...) в аргументах по умолчанию — стандарт FastAPI
  "E712", # `== True` в фильтрах SQLAlchemy — SQL-выражение, а не сравнение Python
  "B904", # raise ... from err: включить отдельной задачей (18 мест)
]

[tool.ruff.lint.per-file-ignores]
# Скрипты настраивают sys.path до импортов backend.*
"backend/scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
  # json_encoders (Decimal -> float) в backend/schemas.py оставлен намеренно:
  # дефолт Pydantic v2 сериализует Decimal строкой, что сломало бы все суммы
  # в API. Пересмотреть при переходе на Pydantic v3 (Annotated + PlainSerializer).
  "ignore:`json_encoders` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
]
