name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend alembic run.py create_admin.py
      - name: Format check (ruff format)
        run: ruff format --check backend alembic run.py create_admin.py
      - name: Migrations (Alembic)
        run: |
          python -m alembic -x database_url=sqlite+aiosqlite:///./.ci_alembic.db upgrade head
          python -m alembic -x database_url=sqlite+aiosqlite:///./.ci_alembic.db check
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Build
        run: npm run build
